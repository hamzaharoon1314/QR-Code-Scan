<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Offline</title>
    <link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

    <!-- Header / Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-semibold tracking-tight text-indigo-600">QR Offline</h1>
            <nav class="flex space-x-2 bg-gray-100 p-1 rounded-lg" role="tablist" aria-label="Application Views">
                <button id="nav-generate" role="tab" aria-selected="true" aria-controls="view-generate" class="px-4 py-1.5 text-sm font-medium rounded-md bg-white text-gray-900 shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    Generate
                </button>
                <button id="nav-scan" role="tab" aria-selected="false" aria-controls="view-scan" class="px-4 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    Scan
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col p-4 max-w-md w-full mx-auto">
        
        <!-- Generate View -->
        <section id="view-generate" role="tabpanel" aria-labelledby="nav-generate" class="flex flex-col h-full space-y-4">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col space-y-3">
                <label for="qr-input" class="text-sm font-medium text-gray-700">Payload</label>
                <textarea id="qr-input" class="w-full h-32 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="Enter text, URL, JSON..."></textarea>
                
                <div class="flex justify-between items-center text-xs text-gray-500" aria-live="polite">
                    <span id="qr-stats">0 characters • 0 bytes</span>
                    <button id="qr-clear" class="text-indigo-600 hover:text-indigo-800 font-medium focus:outline-none" aria-label="Clear payload">Clear</button>
                </div>
            </div>

            <div id="qr-error" role="alert" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100">
                Payload too large to encode.
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex-grow flex flex-col items-center justify-center">
                <div id="qr-container" class="min-h-[200px] min-w-[200px] flex items-center justify-center bg-gray-50 rounded-lg p-4 border border-gray-100" aria-live="polite">
                    <span class="text-gray-400 text-sm">QR Code will appear here</span>
                </div>
                
                <button id="qr-download" class="mt-6 w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed" disabled aria-label="Download QR Code image">
                    Download QR Code
                </button>
            </div>
            
        </section>

            <!-- Scan Modes Toggle -->
            <div class="flex bg-gray-100 p-1 rounded-lg mb-2" role="tablist">
                <button id="mode-camera" role="tab" aria-selected="true" class="flex-1 py-1.5 text-sm font-medium rounded-md bg-white text-gray-900 shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">Camera</button>
                <button id="mode-image" role="tab" aria-selected="false" class="flex-1 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">Image</button>
            </div>
            
            <div id="scan-error" role="alert" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100">
                Camera access denied or unavailable.
            </div>
            
            <div id="image-error" role="alert" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100">
                No QR code was detected in this image.
            </div>

            <!-- Camera Mode UI -->
            <div id="ui-camera" class="flex flex-col space-y-4 h-full">
                <div class="bg-black rounded-xl overflow-hidden shadow-sm relative flex items-center justify-center bg-gray-900 min-h-[300px]" aria-label="Camera preview area">
                    <video id="scan-video" aria-hidden="true" class="w-full h-full object-cover hidden" playsinline></video>
                    <div id="scan-overlay" class="absolute inset-0 pointer-events-none border-[1.5rem] border-black/40"></div>
                    <div id="scan-placeholder" class="text-gray-400 flex flex-col items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>Camera inactive</span>
                    </div>
                    <canvas id="scan-canvas" class="hidden"></canvas>
                </div>

                <div class="flex space-x-2">
                    <button id="scan-toggle" class="flex-grow py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        Start Camera
                    </button>
                    <button id="scan-switch" aria-label="Switch Camera" class="hidden px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-gray-300" title="Switch Camera">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 01-1-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Image Mode UI -->
            <div id="ui-image" class="hidden flex-col h-full items-center justify-center">
                <div id="drop-zone" class="w-full min-h-[300px] border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 flex flex-col items-center justify-center transition-colors hover:bg-indigo-50 hover:border-indigo-300 p-6 text-center cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p class="text-gray-600 font-medium mb-1">Drop QR image here</p>
                    <p class="text-gray-400 text-sm mb-4">or</p>
                    <button id="btn-upload" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        Choose Image
                    </button>
                    <input type="file" id="file-upload" accept="image/png, image/jpeg, image/webp" class="hidden" />
                </div>
            </div>

            <div id="scan-result-container" aria-live="polite" class="hidden bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex-col space-y-3">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h3 class="text-sm font-semibold text-gray-900">Decoded Result</h3>
                    <div class="flex space-x-2">
                        <button id="scan-copy" aria-live="polite" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium focus:outline-none">Copy</button>
                        <button id="scan-clear" aria-label="Clear scan result" class="text-xs text-gray-500 hover:text-gray-700 font-medium focus:outline-none">Clear</button>
                    </div>
                </div>
                <div id="scan-result-content" class="text-sm text-gray-800 break-words whitespace-pre-wrap max-h-48 overflow-y-auto font-mono"></div>
            </div>

        </section>

    </main>

    <script src="js/qrcode.js"></script>
    <script src="js/qrcode_UTF8.js"></script>
    <script src="js/jsQR.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
